<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <defs><marker id="sarrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#374151"/></marker></defs>
  <rect x="0" y="0" width="1500" height="900" fill="#ffffff"/>
  <text x="750" y="46" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">图3-2 验收标准任务的状态与转换条件</text>
  <text x="750" y="78" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="middle">终态只读；重新生成、规则降级、转人工都会创建新任务并记录 retryOf，原任务保留可追溯</text>
  <rect x="80" y="140" width="200" height="76" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
  <text x="180" y="170" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#312e81" text-anchor="middle">排队中 QUEUED</text>
  <text x="180" y="192" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">已落库，等待线程</text>
  <rect x="400" y="140" width="200" height="76" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
  <text x="500" y="170" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#312e81" text-anchor="middle">处理中 RUNNING</text>
  <text x="500" y="192" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">调用模型 / 程序检查</text>
  <rect x="80" y="320" width="200" height="76" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.8"/>
  <text x="180" y="350" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">新任务（重试/规则/人工）</text>
  <text x="180" y="372" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">retryOf 指向原任务</text>
  <rect x="760" y="120" width="210" height="76" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="865" y="150" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#14532d" text-anchor="middle">已生成 SUCCEEDED</text>
  <text x="865" y="172" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">结果可用，可编辑/保存</text>
  <rect x="760" y="250" width="210" height="76" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="865" y="280" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#7f1d1d" text-anchor="middle">校验未通过 CHECK_FAILED</text>
  <text x="865" y="302" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">引用/覆盖不达标</text>
  <rect x="760" y="380" width="210" height="76" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="865" y="410" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#7f1d1d" text-anchor="middle">生成失败 FAILED</text>
  <text x="865" y="432" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">超时/异常/格式错误</text>
  <rect x="760" y="510" width="210" height="76" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="865" y="540" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#78350f" text-anchor="middle">已拒绝 REFUSED</text>
  <text x="865" y="562" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">范围预检，未调模型</text>
  <rect x="400" y="510" width="200" height="76" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.8"/>
  <text x="500" y="540" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">已取消 CANCELLED</text>
  <text x="500" y="562" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">用户取消，结果丢弃</text>
  <line x1="280" y1="178" x2="400" y2="178" stroke="#374151" stroke-width="1.7"  marker-end="url(#sarrow)"/>
  <text x="340" y="170" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" font-weight="400" fill="#374151" text-anchor="middle">线程取到任务</text>
  <line x1="500" y1="216" x2="500" y2="510" stroke="#374151" stroke-width="1.7"  marker-end="url(#sarrow)"/>
  <text x="500" y="355" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" font-weight="400" fill="#374151" text-anchor="middle">排队/处理中取消</text>
  <line x1="600" y1="170" x2="760" y2="150" stroke="#374151" stroke-width="1.7"  marker-end="url(#sarrow)"/>
  <text x="680" y="152" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" font-weight="400" fill="#374151" text-anchor="middle">4 项检查通过</text>
  <line x1="600" y1="190" x2="760" y2="275" stroke="#374151" stroke-width="1.7"  marker-end="url(#sarrow)"/>
  <text x="680" y="224.5" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" font-weight="400" fill="#374151" text-anchor="middle">3 次尝试仍未通过</text>
  <line x1="600" y1="205" x2="760" y2="405" stroke="#374151" stroke-width="1.7"  marker-end="url(#sarrow)"/>
  <text x="680" y="297" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" font-weight="400" fill="#374151" text-anchor="middle">模型异常/超时/解析失败</text>
  <line x1="600" y1="220" x2="760" y2="535" stroke="#374151" stroke-width="1.7"  marker-end="url(#sarrow)"/>
  <text x="680" y="369.5" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" font-weight="400" fill="#374151" text-anchor="middle">范围预检命中（不调用模型）</text>
  <line x1="400" y1="548" x2="280" y2="548" stroke="#6b7280" stroke-width="1.7" stroke-dasharray="8 6" marker-end="url(#sarrow)"/>
  <text x="340" y="540" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle">取消后重新发起</text>
  <rect x="80" y="660" width="1180" height="150" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-dasharray="6 4"/>
  <text x="100" y="690" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="700" fill="#111827" text-anchor="start">并发与一致性约定</text>
  <text x="100" y="718" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" font-weight="400" fill="#374151" text-anchor="start">① 同一档案 + 同一 Prompt 版本 + 同一模式存在排队/处理中的任务时，重复提交返回同一任务编号（duplicate=true），不再新建。</text>
  <text x="100" y="740" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" font-weight="400" fill="#374151" text-anchor="start">② 取消：排队任务立即置为已取消；处理中的任务只置 cancelRequested，线程在当前模型调用返回后丢弃结果并置为已取消。</text>
  <text x="100" y="762" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" font-weight="400" fill="#374151" text-anchor="start">③ 终态不可覆盖：迟到结果、重复回调、并发保存都不会修改已结束任务的状态；重新生成必然产生新 taskId。</text>
  <text x="100" y="784" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" font-weight="400" fill="#374151" text-anchor="start">④ 保存到档案幂等：appliedAt 非空时再次 apply 返回同一 savedAt，不重复写入；放弃已保存的结果会被拒绝（ALREADY_SAVED）。</text>
</svg>