server:
  port: ${PORT:8080}
spring:
  datasource:
    url: jdbc:h2:file:./data/ambiguity;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
app:
  ai-mode: ${AI_MODE:mock}
  qwen-api-key: ${DASHSCOPE_API_KEY:}
  qwen-model: ${QWEN_MODEL:qwen-plus}
  qwen-url: ${QWEN_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
  vision-enabled: ${VISION_ENABLED:true}
  qwen-vision-model: ${QWEN_VISION_MODEL:qwen-vl-max}
  qwen-vision-url: ${QWEN_VISION_URL:${app.qwen-url}}
  vision-max-units: ${VISION_MAX_UNITS:30}
  pdf-font-path: ${PDF_FONT_PATH:}
  agent:
    enabled: ${AGENT_ENABLED:true}
    max-steps: ${AGENT_MAX_STEPS:6}
    max-tool-calls-per-step: ${AGENT_MAX_TOOL_CALLS_PER_STEP:3}
    model-timeout-ms: ${AGENT_MODEL_TIMEOUT_MS:30000}
    tool-timeout-ms: ${AGENT_TOOL_TIMEOUT_MS:5000}
    total-timeout-ms: ${AGENT_TOTAL_TIMEOUT_MS:60000}
    max-answer-retries: ${AGENT_MAX_ANSWER_RETRIES:2}
    confirm-ttl-ms: ${AGENT_CONFIRM_TTL_MS:300000}
    log-dir: ${AGENT_LOG_DIR:./logs/agent-runs}
  acceptance:
    enabled: ${ACCEPTANCE_ENABLED:true}
    model: ${ACCEPTANCE_MODEL:qwen-plus}
    temperature: ${ACCEPTANCE_TEMPERATURE:0.2}
    max-tokens: ${ACCEPTANCE_MAX_TOKENS:2000}
    timeout-ms: ${ACCEPTANCE_TIMEOUT_MS:60000}
    max-attempts: ${ACCEPTANCE_MAX_ATTEMPTS:3}
    max-input-chars: ${ACCEPTANCE_MAX_INPUT_CHARS:3000}
    log-dir: ${ACCEPTANCE_LOG_DIR:./logs/acceptance-runs}
  integration:
    enabled: ${INTEGRATION_ENABLED:true}
    executor-core: ${INTEGRATION_EXECUTOR_CORE:2}
    executor-max: ${INTEGRATION_EXECUTOR_MAX:4}
    queue-capacity: ${INTEGRATION_QUEUE_CAPACITY:20}
    retention-days: ${INTEGRATION_RETENTION_DAYS:30}
    cleanup-interval-ms: ${INTEGRATION_CLEANUP_INTERVAL_MS:3600000}
